<div class="login-page">
  <!-- Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="d-flex flex-column align-items-center w-100" style="z-index:1">

    <!-- Logo -->
    <div class="logo-circle mb-3">
      <mat-icon class="logo-icon">play_arrow</mat-icon>
    </div>

    <!-- Glass Card -->
    <div class="glass-card w-100">
      <p class="subtitle">We want to make sure it's <em>you</em></p>
      <h1 class="title">Sign in to your<br>StreamVault account</h1>

      <!-- Email -->
      <mat-form-field appearance="outline" class="w-100 glass-field">
        <mat-label>Email or username</mat-label>
        <input matInput type="email" [(ngModel)]="email"
               placeholder="you@example.com" autocomplete="email"/>
        <mat-icon matSuffix>mail_outline</mat-icon>
      </mat-form-field>

      <!-- Password -->
      <mat-form-field appearance="outline" class="w-100 glass-field">
        <mat-label>Password</mat-label>
        <input matInput [type]="showPassword ? 'text' : 'password'"
               [(ngModel)]="password" autocomplete="current-password"/>
        <button mat-icon-button matSuffix (click)="togglePassword()" type="button">
          <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <!-- Remember + Forgot -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <mat-checkbox [(ngModel)]="rememberMe" class="glass-checkbox">
          Stay signed in
        </mat-checkbox>
        <a class="forgot-link" href="#">Forget password?</a>
      </div>

      <!-- Success -->
      <div *ngIf="success" class="alert-box success-box d-flex align-items-center gap-2 mb-3">
        <mat-icon class="status-icon success-icon">check_circle</mat-icon>
        <span>Success!</span>
      </div>

      <!-- Error -->
      <div *ngIf="error" class="alert-box error-box d-flex align-items-center gap-2 mb-3">
        <mat-icon class="status-icon error-icon">warning_amber</mat-icon>
        <span>{{ error }}</span>
      </div>

      <!-- Sign In -->
      <button class="signin-btn w-100 mb-3"
              (click)="onSubmit()"
              [disabled]="loading">
        <mat-spinner *ngIf="loading" diameter="20" class="btn-spinner"></mat-spinner>
        <span *ngIf="!loading">Sign In</span>
      </button>

      <!-- Divider -->
      <div class="divider my-3"><span>or</span></div>

      <!-- OAuth -->
      <button class="oauth-btn w-100 mb-2">
        <svg class="oauth-icon" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>

      <button class="oauth-btn w-100 mb-2">
        <svg class="oauth-icon" viewBox="0 0 24 24">
          <path fill="white" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        Sign In with GitHub
      </button>

      <button class="oauth-btn w-100">Sign In with SSO</button>
    </div>

    <a class="bottom-link mt-4" href="#">Use a different email instead</a>
  </div>
</div>
